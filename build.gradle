plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version "${neo_moddev}"
    id 'com.diffplug.spotless' version "8.8.0"
    id 'me.modmuss50.mod-publish-plugin' version "2.1.1"
}

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-neoforge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'AzureDoom'
        url = 'https://maven.azuredoom.com/mods'
    }
    maven {
        name = 'Cursemaven'
        url = 'https://www.cursemaven.com/'
        content { includeGroup 'curse.maven' }
    }
}

neoForge {
    version = neo_version
    accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            gameDirectory = project.file('runs/client')
        }
        client2 {
            client()
            gameDirectory = project.file('runs/client2')
            programArguments.addAll('--username', 'Dweller2')
        }
        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

dependencies {
    implementation "mod.azure.azurelib:azurelib-neo-${minecraft_version}:${azurelib_version}"
    compileOnly 'org.jetbrains:annotations:24.1.0'
    implementation "curse.maven:lithostitched-936015:9154967"
    jarJar(implementation("com.azure.azurecortex:azurecortex-neoforge-${minecraft_version}:${azurecortex_version}")) {
        version {
            strictly "[${azurecortex_version}]"
            prefer azurecortex_version
        }
    }
}

def expandProps = [
        'mod_id'                 : mod_id,
        'mod_name'               : mod_name,
        'mod_license'            : mod_license,
        'mod_version'            : mod_version,
        'mod_authors'            : mod_authors,
        'mod_description'        : mod_description,
        'minecraft_version_range': minecraft_version_range,
        'neo_version_range'      : neo_version_range,
        'loader_version_range'   : loader_version_range,
        'azurelib_version'       : azurelib_version
]

tasks.named('processResources', ProcessResources) {
    inputs.properties(expandProps)
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand expandProps
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = java_version as int
}

jar {
    from('LICENSE') {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

spotless {
    java {
        eclipse().configFile("$rootDir/eclipse-formatter.xml")
        endWithNewline()
        importOrder("", "java", group.toString(), "\\#")
        leadingTabsToSpaces(4)
        removeUnusedImports()
        trimTrailingWhitespace()
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn("spotlessApply")
}

def keyPropsFile = new File(rootProject.projectDir, "key.properties")
if (keyPropsFile.exists()) {
    publishMods {
        def releaseProp = new Properties()
        releaseProp.load(new FileInputStream(keyPropsFile))
        file = remapJar.archiveFile
        changelog = rootProject.file("changelog.md").text
        type = STABLE
        modLoaders.add("neoforge")
        displayName = file.map { it.asFile.name }

        curseforge {
            projectId = project.curseforgeID
            projectSlug = project.projectSlug
            accessToken = releaseProp.getProperty("curseKey")
            minecraftVersions.add("${minecraft_version}")
            javaVersions.add(JavaVersion.VERSION_25)
            requires {
                slug = "azurelib"
            }
            requires {
                slug = "lithostitched"
            }
            client = true
            server = true
        }

        modrinth {
            projectId = project.modrinth_id
            accessToken = releaseProp.getProperty('modrinthKey')
            minecraftVersions.add(project.minecraft_version)
            requires {
                slug = "azurelib"
            }
            requires {
                slug = "lithostitched"
            }
            environment = CLIENT_AND_SERVER
        }

        discord {
            webhookUrl = releaseProp.getProperty("discordKey")
            username = "Azurelib Update Bot"
            avatarUrl = "https://cdn.modrinth.com/data/7zlUOZvb/a722b12250c1f42c63dd269f2e4aeefd7611f8fd.png"

            content = changelog.map { text ->
                final String mcVersion = project.property("minecraft_version")

                final String header =
                        "# A new version of AzureLib has been released for Minecraft ${mcVersion} for StationAPI!\n\n"

                final String suffix =
                        "\n\n**Full changelog available on Modrinth below.**"

                if (header.length() + text.length() + suffix.length() <= 2000) {
                    return header + text + suffix
                }

                def result = new StringBuilder(header)

                for (String line : text.readLines()) {
                    if (result.length() + line.length() + 1 + suffix.length() > 2000) {
                        break
                    }

                    result.append(line).append("\n")
                }

                return result.toString().trim() + suffix
            }

            style {
                look = "MODERN"
                link = "BUTTON"
            }

            setPlatforms(
                    publishMods.platforms.modrinth
            )
        }
    }
}
